name: daily-report

on:
  schedule:
    - cron: '30 20 * * 0-4'        # KST 월~금 05:30 (UTC 일~목 20:30). 06:28 Claude 예약 전에 데이터를 먼저 만든다. GitHub 예약은 수십 분 지연될 수 있음
  push:
    branches: [main]
    paths: ['narrative/*.json']    # Claude가 1절 원인 문구를 올리면 발행 단계 실행
  workflow_dispatch:
    inputs:
      date:
        description: '기준일 YYYYMMDD (비우면 자동)'
        required: false
      write:
        description: '작성일 YYYYMMDD (비우면 자동, 월요일 보고서는 월요일 날짜)'
        required: false
      force:
        description: '이미 발행된 날짜도 다시 발행 (수동 실행은 항상 새 버전을 만들므로 참고용)'
        type: boolean
        default: false

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: Python 패키지 설치
        run: pip install -r requirements.txt

      - name: Google Drive 인증 파일 준비
        env:
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
        run: |
          mkdir -p scripts/secrets && chmod 700 scripts/secrets
          printf '%s' "$GDRIVE_CREDENTIALS_JSON" > scripts/secrets/credentials.json
          printf '%s' "$GDRIVE_TOKEN_JSON" > scripts/secrets/token.json
          chmod 600 scripts/secrets/*.json

      - name: 기준일 정하기
        id: dates
        env:
          EVENT: ${{ github.event_name }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_WRITE: ${{ github.event.inputs.write }}
        run: |
          if [ "$EVENT" = "push" ]; then
            F=$(git diff --name-only HEAD~1 HEAD -- narrative | head -1)
            NAME=$(basename "$F" .json)
            D=$(echo "$NAME" | grep -oE '[0-9]{8}' | sed -n 1p)
            W=$(echo "$NAME" | grep -oE '[0-9]{8}' | sed -n 2p)
          else
            D="$INPUT_DATE"
            W="$INPUT_WRITE"
          fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "write=$W" >> "$GITHUB_OUTPUT"
          echo "기준일 인자: '${D}', 작성일 인자: '${W}' (비어 있으면 자동 계산)"

      - name: 파이프라인 실행
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          CHART_FONT: NanumGothic
          # 수동 실행(workflow_dispatch)은 보고서 작성 명령이므로 항상 새 버전을 만든다.
          # 자동(07:00)과 narrative push는 같은 날짜에 이미 발행된 기록이 있으면 건너뛴다.
          FORCE: ${{ (github.event_name == 'workflow_dispatch' || github.event.inputs.force == 'true') && '1' || '0' }}
        run: bash scripts/run_pipeline.sh "${{ steps.dates.outputs.date }}" "${{ steps.dates.outputs.write }}"

      - name: 지침·컨텍스트·실행방법 Drive 업로드 (최신 버전, 같은 이름은 건너뜀)
        if: always()
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          cd scripts && python3 upload_docs.py --docs-dir ../docs --folder-id "$GDRIVE_FOLDER_ID"

      - name: 결과 저장 (데이터·발행 기록만 커밋)
        if: always()
        run: |
          rm -rf scripts/secrets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state reports
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily report state [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "커밋할 변경 없음"
          fi
