name: daily-report
concurrency:
  group: daily-report
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
    - run: echo hello
true:
  schedule:
  - cron: 30 20 * * 0-4
  push:
    branches:
    - main
    paths:
    - narrative/*.json
  workflow_dispatch:
    inputs:
      date:
        description: 기준일 YYYYMMDD (비우면 자동)
        required: false
      write:
        description: 작성일 YYYYMMDD (비우면 자동, 월요일 보고서는 월요일 날짜)
        required: false
      force:
        description: 이미 발행된 날짜도 다시 발행 (수동 실행은 항상 새 버전을 만들므로 참고용)
        type: boolean
        default: false
