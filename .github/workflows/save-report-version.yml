name: save-report-version

on:
  workflow_dispatch:
    inputs:
      src:
        description: 'reports/ 안의 PDF 파일명'
        required: true
      date:
        description: '기준일 YYYYMMDD (state 키)'
        required: true
      write:
        description: '작성일 YYYYMMDD (파일명 날짜)'
        required: true
      version:
        description: '상태 버전 번호 (state 키)'
        required: true
      title:
        description: 'Drive 제목 (비우면 증시추세분석 (작성일)-vN.pdf)'
        required: false
        default: ''

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum
      - name: Python 패키지 설치
        run: pip install -r requirements.txt
      - name: Google Drive 인증 파일 준비
        env:
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
        run: |
          mkdir -p scripts/secrets && chmod 700 scripts/secrets
          printf '%s' "$GDRIVE_CREDENTIALS_JSON" > scripts/secrets/credentials.json
          printf '%s' "$GDRIVE_TOKEN_JSON" > scripts/secrets/token.json
          chmod 600 scripts/secrets/*.json
      - name: 보고서 PDF Drive 저장
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: bash scripts/save_report_version.sh "${{ github.event.inputs.src }}" "${{ github.event.inputs.date }}" "${{ github.event.inputs.write }}" "${{ github.event.inputs.version }}" "${{ github.event.inputs.title }}"
      - name: 결과 커밋
        if: always()
        run: |
          rm -rf scripts/secrets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports state
          if ! git diff --cached --quiet; then
            git commit -m "chore: save report version ${{ github.event.inputs.write }} v${{ github.event.inputs.version }} [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "커밋할 변경 없음"
          fi
