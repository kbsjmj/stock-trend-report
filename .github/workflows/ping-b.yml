name: daily-report
'on':
  schedule:
  - cron: 30 20 * * 0-4
  push:
    branches:
    - main
    paths:
    - narrative/*.json
  workflow_dispatch:
    inputs:
      date:
        description: 기준일 YYYYMMDD (비우면 자동)
        required: false
      write:
        description: 작성일 YYYYMMDD (비우면 자동, 월요일 보고서는 월요일 날짜)
        required: false
      force:
        description: 이미 발행된 날짜도 다시 발행 (수동 실행은 항상 새 버전을 만들므로 참고용)
        type: boolean
        default: false
concurrency:
  group: daily-report
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements.txt
    - name: 한글 폰트 설치
      run: echo skipped
    - name: Python 패키지 설치
      run: echo skipped
    - name: Google Drive 인증 파일 준비
      env:
        GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
        GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
      run: echo skipped
    - name: 기준일 정하기
      id: dates
      env:
        EVENT: ${{ github.event_name }}
        INPUT_DATE: ${{ github.event.inputs.date }}
        INPUT_WRITE: ${{ github.event.inputs.write }}
      run: echo skipped
    - name: 파이프라인 실행
      env:
        KRX_ID: ${{ secrets.KRX_ID }}
        KRX_PW: ${{ secrets.KRX_PW }}
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        CHART_FONT: NanumGothic
        FORCE: ${{ (github.event_name == 'workflow_dispatch' || github.event.inputs.force
          == 'true') && '1' || '0' }}
      run: echo skipped
    - name: 지침·컨텍스트·실행방법 Drive 업로드 (최신 버전, 같은 이름은 건너뜀)
      if: always()
      env:
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      run: echo skipped
    - name: 프로그램 백업 (드라이브 버전 폴더 P#, 내용이 바뀐 경우만)
      if: always()
      env:
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      run: echo skipped
    - name: 결과 저장 (데이터·발행 기록만 커밋)
      if: always()
      run: echo skipped
